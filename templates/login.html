<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <h1>🔐 Login</h1>
        <div class="lang-toggle"><a href="/setlang/en">English</a><a href="/setlang/hi">हिंदी</a></div>
    </div>

    <div class="container">
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="POST">
            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <a class="back-link" href="/register">No account? Register here</a>
        <a class="back-link" href="/">← {{ t.back_home }}</a>
    </div>
</body>
</html>
