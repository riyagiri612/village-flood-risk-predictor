<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <h1>📝 Create an Account</h1>
        <div class="lang-toggle"><a href="/setlang/en">English</a><a href="/setlang/hi">हिंदी</a></div>
    </div>

    <div class="container">
        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
        <form method="POST">
            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Password (at least 6 characters):</label>
            <input type="password" name="password" required>

            <button type="submit">Register</button>
        </form>
        <a class="back-link" href="/login">Already have an account? Login</a>
        <a class="back-link" href="/">← {{ t.back_home }}</a>
    </div>
</body>
</html>
